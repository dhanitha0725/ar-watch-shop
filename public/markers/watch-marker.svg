<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Thick Black Border (50% area) -->
  <rect width="500" height="500" fill="black"/>
  <!-- White Inner Area -->
  <rect x="100" y="100" width="300" height="300" fill="white"/>
  <!-- Distinct Asymmetric High Contrast Geometry (CHRONO-AR Logo) -->
  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="100" fill="none" stroke="black" stroke-width="24"/>
  <!-- Watch Hands (pointing at 10:10 with anchor notch) -->
  <line x1="250" y1="250" x2="200" y2="190" stroke="black" stroke-width="20" stroke-linecap="round"/>
  <line x1="250" y1="250" x2="310" y2="200" stroke="black" stroke-width="16" stroke-linecap="round"/>
  <circle cx="250" cy="250" r="18" fill="black"/>
  <!-- Top Marker Crown Indicator (gives orientation asymmetry) -->
  <rect x="235" y="125" width="30" height="20" fill="black" rx="4"/>
  <!-- Brand text CHRONO -->
  <text x="250" y="315" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="black" text-anchor="middle" letter-spacing="3">CHRONO</text>
</svg>
