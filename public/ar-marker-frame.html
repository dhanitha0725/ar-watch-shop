<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MindAR Image Target Camera View</title>
    <!-- A-Frame 1.5.0 & MindAR 1.2.5 for reliable Natural Feature Tracking on modern iOS & Android -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        background-color: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .mindar-ui-overlay {
        display: none !important;
      }
      video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: 0 !important;
        margin: 0 !important;
        display: block !important;
      }
      .a-canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 1 !important;
        touch-action: none;
        cursor: grab;
      }
      .a-canvas.is-rotating {
        cursor: grabbing;
      }
      a-scene {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 1 !important;
      }
      #loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #ffffff;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #0071e3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Sleek Initialization Overlay -->
    <div id="loader-overlay">
      <div class="spinner"></div>
      <div style="font-size: 14px; font-weight: 500; letter-spacing: -0.01em;">Initializing MindAR Engine...</div>
      <div style="font-size: 12px; opacity: 0.7; margin-top: 4px;">Loading camera and neural tracking WASM</div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: /markers/marker.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; exposure: 1.05; antialias: true; alpha: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Subtle direct key/fill lighting; the PMREM studio map provides the primary PBR reflections. -->
      <a-entity light="type: hemisphere; color: #f8fafc; groundColor: #1f2937; intensity: 0.3;"></a-entity>
      <a-entity light="type: directional; color: #fffaf2; intensity: 1.2; position: -3 5 4"></a-entity>
      <a-entity light="type: directional; color: #bfdbfe; intensity: 0.45; position: 3 2 -4"></a-entity>

      <!-- MindAR Natural Feature Image Target 0 (Card / Pattern) -->
      <a-entity id="mindar-target-0" mindar-image-target="targetIndex: 0">
        <a-entity id="watch-pivot" position="0 0 0">
          <a-entity
            id="watch-model"
            visible="false"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const targetEntity = document.getElementById('mindar-target-0');
      const modelPivot = document.getElementById('watch-pivot');
      let watchModel = document.getElementById('watch-model');
      const loaderOverlay = document.getElementById('loader-overlay');
      let targetFound = false;
      let modelReady = false;
      let currentModelUrl = '';
      let baseRotation = { x: 0, y: 0, z: 0 };
      let sessionRotation = { x: 0, y: 0, z: 0 };
      let currentEnvTexture = null;

      const DRAG_ROTATION_SENSITIVITY = 0.5;
      const MAX_PITCH = 80;

      // These values are derived from each GLB's exported bounding box. Keeping
      // the calibration static avoids the mobile A-Frame bounding-box bug that
      // reported valid GLB meshes as zero-size geometry.
      const MODEL_CALIBRATIONS = {
        '/models/apple-watch-ultra.glb': { position: '-0.0103 -0.0080 -0.0317' },
        '/models/chronograph-mudmaster.glb': { position: '-0.0002 -0.0001 0.1343' },
        '/models/digital-watch.glb': { position: '0.2112 0.0265 -0.0005' },
        '/models/seiko-classic.glb': { position: '-0.0169 -0.3575 -0.0137' },
      };

      /**
       * Creates a calibrated virtual photo-studio environment for PBR IBL reflections.
       * Uses balanced studio softboxes (1.0 - 1.5 intensity) and a neutral gradient backdrop
       * to give metals (steel, titanium, chrome) gleaming reflections without blowing out materials.
       */
      function createStudioEnvironment(THREE) {
        const envScene = new THREE.Scene();

        // 1. Studio backdrop room (neutral dark-gray to prevent washed-out diffuse)
        const roomGeo = new THREE.BoxGeometry(30, 30, 30);
        const roomMat = new THREE.MeshBasicMaterial({
          color: 0x222428,
          side: THREE.BackSide,
          toneMapped: false
        });
        const room = new THREE.Mesh(roomGeo, roomMat);
        envScene.add(room);

        // Helper to create softbox reflection panels
        function createSoftbox(width, height, colorHex, intensity, x, y, z, lookAtX, lookAtY, lookAtZ) {
          const geo = new THREE.PlaneGeometry(width, height);
          const color = new THREE.Color(colorHex).multiplyScalar(intensity);
          const mat = new THREE.MeshBasicMaterial({
            color,
            side: THREE.DoubleSide,
            // Preserve HDR panel values while generating the PMREM texture.
            toneMapped: false
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y, z);
          mesh.lookAt(lookAtX, lookAtY, lookAtZ);
          return mesh;
        }

        // Top main studio softbox (overhead reflection for dial crystal & bezels)
        envScene.add(createSoftbox(10, 10, 0xffffff, 5.0, 0, 12, 1, 0, 0, 0));

        // Left key softbox (creates clean metallic rim reflections on watch cases/bracelets)
        envScene.add(createSoftbox(6, 12, 0xffffff, 3.0, -12, 4, 3, 0, 0, 0));

        // Right fill softbox (subtle cool tint for photographic depth)
        envScene.add(createSoftbox(6, 12, 0xdbeafe, 1.8, 12, 4, -2, 0, 0, 0));

        // Front-facing soft fill panel
        envScene.add(createSoftbox(8, 8, 0xf8fafc, 1.5, 0, 2, 12, 0, 0, 0));

        // Bottom bounce panel (simulates table/ground reflection)
        envScene.add(createSoftbox(12, 12, 0x33373e, 0.35, 0, -12, 0, 0, 0, 0));

        return envScene;
      }

      function disposeStudioEnvironment(environment) {
        environment.traverse((object) => {
          object.geometry?.dispose?.();
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          materials.forEach((material) => material?.dispose?.());
        });
      }

      function setupStudioEnvironment() {
        const THREE = window.AFRAME?.THREE;
        if (!THREE || !sceneEl.renderer) return;

        const renderer = sceneEl.renderer;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        if (renderer.outputColorSpace !== undefined) {
          renderer.outputColorSpace = THREE.SRGBColorSpace;
        }

        let pmremGenerator;
        let studioEnv;
        try {
          pmremGenerator = new THREE.PMREMGenerator(renderer);
          studioEnv = createStudioEnvironment(THREE);
          const nextEnvTexture = pmremGenerator.fromScene(studioEnv, 0.04).texture;

          if (currentEnvTexture) {
            currentEnvTexture.dispose();
          }
          currentEnvTexture = nextEnvTexture;
          sceneEl.object3D.environment = currentEnvTexture;
          applyEnvMapToModel();
        } catch (e) {
          console.log('Could not generate studio environment PMREM:', e);
        } finally {
          pmremGenerator?.dispose();
          if (studioEnv) disposeStudioEnvironment(studioEnv);
        }
      }

      function applyEnvMapToModel() {
        if (!currentEnvTexture || !watchModel) return;
        const threeObject = watchModel.getObject3D('mesh');
        if (!threeObject) return;

        threeObject.traverse((child) => {
          if (child.isMesh && child.material) {
            const materials = Array.isArray(child.material) ? child.material : [child.material];
            materials.forEach((mat) => {
              if (mat.isMeshStandardMaterial || mat.isMeshPhysicalMaterial) {
                mat.envMap = currentEnvTexture;
                mat.envMapIntensity = 1.0;
                mat.needsUpdate = true;
              }
            });
          }
        });
      }

      function parseRotation(rotation) {
        const values = String(rotation || '0 0 0').trim().split(/\s+/).map(Number);
        return {
          x: Number.isFinite(values[0]) ? values[0] : 0,
          y: Number.isFinite(values[1]) ? values[1] : 0,
          z: Number.isFinite(values[2]) ? values[2] : 0,
        };
      }

      function applySessionRotation() {
        if (!watchModel) return;

        watchModel.setAttribute('rotation', {
          x: baseRotation.x + sessionRotation.x,
          y: baseRotation.y + sessionRotation.y,
          z: baseRotation.z + sessionRotation.z,
        });
      }

      function enableDragRotation() {
        const canvas = sceneEl.canvas;
        if (!canvas) return;

        let activePointerId = null;
        let lastX = 0;
        let lastY = 0;

        const stopDragging = (event) => {
          if (activePointerId !== event.pointerId) return;

          if (canvas.hasPointerCapture(event.pointerId)) {
            canvas.releasePointerCapture(event.pointerId);
          }
          activePointerId = null;
          canvas.classList.remove('is-rotating');
        };

        canvas.addEventListener('pointerdown', (event) => {
          if (activePointerId !== null || (event.pointerType === 'mouse' && event.button !== 0)) return;

          activePointerId = event.pointerId;
          lastX = event.clientX;
          lastY = event.clientY;
          canvas.setPointerCapture(event.pointerId);
          canvas.classList.add('is-rotating');
          event.preventDefault();
        });

        canvas.addEventListener('pointermove', (event) => {
          if (activePointerId !== event.pointerId) return;

          const deltaX = event.clientX - lastX;
          const deltaY = event.clientY - lastY;
          lastX = event.clientX;
          lastY = event.clientY;

          sessionRotation.y += deltaX * DRAG_ROTATION_SENSITIVITY;
          sessionRotation.x = Math.max(
            -MAX_PITCH,
            Math.min(MAX_PITCH, sessionRotation.x - deltaY * DRAG_ROTATION_SENSITIVITY)
          );
          applySessionRotation();
          event.preventDefault();
        });

        canvas.addEventListener('pointerup', stopDragging);
        canvas.addEventListener('pointercancel', stopDragging);
        canvas.addEventListener('lostpointercapture', stopDragging);
      }

      function notifyParent(type, data) {
        try {
          window.parent.postMessage({ source: 'mindar-marker-frame', type, data }, '*');
        } catch (e) {}
      }

      function hideLoader() {
        if (loaderOverlay) {
          loaderOverlay.style.opacity = '0';
          setTimeout(() => {
            loaderOverlay.style.display = 'none';
          }, 400);
        }
      }

      function updateTrackingState() {
        if (targetFound && modelReady) {
          notifyParent('markerFound', 'mindar-card');
        }
      }

      function bindModelEvents(modelEntity, modelUrl) {
        modelEntity.addEventListener('model-loaded', () => {
          // A-Frame loads asynchronously. Ignore callbacks from an older
          // entity if the user switched models before that load completed.
          if (modelEntity !== watchModel || modelUrl !== currentModelUrl) return;

          const calibration = MODEL_CALIBRATIONS[modelUrl];
          modelEntity.setAttribute('position', calibration?.position || '0 0 0');
          modelEntity.setAttribute('visible', 'true');

          // Apply realistic PBR reflections to all materials.
          applyEnvMapToModel();

          modelReady = true;
          notifyParent('modelLoaded', modelUrl);
          updateTrackingState();
        });

        modelEntity.addEventListener('model-error', (event) => {
          // Do not let an old request overwrite the state of the active model.
          if (modelEntity !== watchModel || modelUrl !== currentModelUrl) return;

          modelReady = false;
          modelEntity.setAttribute('visible', 'false');
          notifyParent('modelError', event.detail?.src || event.detail?.error?.message || 'Unable to fetch or parse the GLB file.');
        });
      }

      function createModelEntity(modelUrl) {
        if (!modelPivot) return null;

        if (watchModel) {
          watchModel.remove();
        }

        const nextModel = document.createElement('a-entity');
        nextModel.id = 'watch-model';
        nextModel.setAttribute('visible', 'false');
        modelPivot.appendChild(nextModel);
        watchModel = nextModel;
        bindModelEvents(nextModel, modelUrl);
        return nextModel;
      }

      // MindAR Lifecycle Events
      sceneEl.addEventListener('arReady', () => {
        hideLoader();
        notifyParent('arReady');
      });

      sceneEl.addEventListener('arError', (event) => {
        hideLoader();
        notifyParent('arError', event.detail);
      });

      if (sceneEl.canvas) {
        enableDragRotation();
      } else {
        sceneEl.addEventListener('renderstart', enableDragRotation, { once: true });
      }

      // Initialize Studio Lighting & PMREM Environment Map
      if (sceneEl.renderer) {
        setupStudioEnvironment();
      } else {
        sceneEl.addEventListener('renderstart', setupStudioEnvironment, { once: true });
      }

      // Target Tracking Events
      if (targetEntity) {
        targetEntity.addEventListener('targetFound', () => {
          targetFound = true;
          updateTrackingState();
        });
        targetEntity.addEventListener('targetLost', () => {
          targetFound = false;
          notifyParent('markerLost', 'mindar-card');
        });
      }

      // Fallback timer to hide loader if arReady fired before listener
      setTimeout(() => {
        hideLoader();
      }, 3500);

      // Initial URL parameter parsing
      const params = new URLSearchParams(window.location.search);
      const initialModel = params.get('model');
      const initialScale = params.get('scale') || '1.0 1.0 1.0';
      const initialRotation = params.get('rotation') || '0 0 0';

      function applyWatchAttributes(url, scale, rotation) {
        let modelToUpdate = watchModel;

        if (url && modelPivot) {
          modelReady = false;
          currentModelUrl = url;
          modelToUpdate = createModelEntity(url);
          notifyParent('modelLoading', url);
        }
        if (scale && modelToUpdate) {
          modelToUpdate.setAttribute('scale', scale);
        }
        if (rotation && modelToUpdate) {
          baseRotation = parseRotation(rotation);
          sessionRotation = { x: 0, y: 0, z: 0 };
          applySessionRotation();
        }
        if (url && modelToUpdate) {
          modelToUpdate.setAttribute('gltf-model', `url(${url})`);
        }
      }

      if (initialModel) {
        applyWatchAttributes(initialModel, initialScale, initialRotation);
      }

      // Handle real-time updates from parent React application
      window.addEventListener('message', (event) => {
        if (!event.data) return;
        const target = event.data.target;
        if (target !== 'mindar-marker-frame') return;

        const { action, modelUrl, scale, rotation } = event.data;

        if (action === 'updateWatch') {
          applyWatchAttributes(modelUrl, scale, rotation);
        } else if (action === 'updateScale') {
          if (scale && watchModel) {
            watchModel.setAttribute('scale', scale);
          }
        }
      });
    </script>
  </body>
</html>
