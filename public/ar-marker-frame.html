<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR.js Marker Camera View</title>
    <!-- A-Frame 1.3.0 & AR.js 3.4.5 for rock-solid webcam tracking -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        background-color: transparent !important;
      }
      #arjs-video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: 0 !important;
        margin: 0 !important;
        display: block !important;
      }
      .a-canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 1 !important;
      }
      a-scene {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 1 !important;
      }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
      renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
    >
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 2.2; position: 2 4 3"></a-entity>
      <a-entity light="type: directional; color: #90cdf4; intensity: 1.0; position: -2 -1 2"></a-entity>

      <!-- Standard Hiro Marker -->
      <a-marker preset="hiro" id="hiro-marker" emitevents="true" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="4">
        <a-entity id="watch-pivot-hiro" position="0 0.15 0">
          <a-entity
            id="watch-model-hiro"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-marker>

      <!-- Custom Pattern Marker -->
      <a-marker type="pattern" url="/markers/watch-marker.patt" id="custom-marker" emitevents="true" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="4">
        <a-entity id="watch-pivot-custom" position="0 0.15 0">
          <a-entity
            id="watch-model-custom"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const hiroMarker = document.getElementById('hiro-marker');
      const customMarker = document.getElementById('custom-marker');
      const modelHiro = document.getElementById('watch-model-hiro');
      const modelCustom = document.getElementById('watch-model-custom');

      function notifyParent(type, data) {
        try {
          window.parent.postMessage({ source: 'arjs-marker-frame', type, data }, '*');
        } catch (e) {}
      }

      if (hiroMarker) {
        hiroMarker.addEventListener('markerFound', () => notifyParent('markerFound', 'hiro'));
        hiroMarker.addEventListener('markerLost', () => notifyParent('markerLost', 'hiro'));
      }

      if (customMarker) {
        customMarker.addEventListener('markerFound', () => notifyParent('markerFound', 'custom'));
        customMarker.addEventListener('markerLost', () => notifyParent('markerLost', 'custom'));
      }

      // Initial URL parameter parsing
      const params = new URLSearchParams(window.location.search);
      const initialModel = params.get('model');
      const initialScale = params.get('scale') || '0.06 0.06 0.06';
      const initialRotation = params.get('rotation') || '0 0 0';

      function applyWatchAttributes(url, scale, rotation) {
        if (url) {
          modelHiro.setAttribute('gltf-model', `url(${url})`);
          modelCustom.setAttribute('gltf-model', `url(${url})`);
        }
        if (scale) {
          modelHiro.setAttribute('scale', scale);
          modelCustom.setAttribute('scale', scale);
        }
        if (rotation) {
          modelHiro.setAttribute('rotation', rotation);
          modelCustom.setAttribute('rotation', rotation);
        }
      }

      if (initialModel) {
        applyWatchAttributes(initialModel, initialScale, initialRotation);
      }

      // Handle real-time updates from parent React application
      window.addEventListener('message', (event) => {
        if (!event.data || event.data.target !== 'arjs-marker-frame') return;
        const { action, modelUrl, scale, rotation } = event.data;

        if (action === 'updateWatch') {
          applyWatchAttributes(modelUrl, scale, rotation);
        } else if (action === 'updateScale') {
          if (scale) {
            modelHiro.setAttribute('scale', scale);
            modelCustom.setAttribute('scale', scale);
          }
        }
      });
    </script>
  </body>
</html>
